<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">Synthetic prediction-timing example</title><desc id="desc">A measurement occurs at 09:50, the prediction is at 10:00, and the measurement is entered at 10:12. The value is unavailable at prediction time. The outcome window starts after 10:00.</desc><rect width="900" height="390" fill="#e1e7d9"/><g font-family="Arial,sans-serif" fill="#213c32"><text x="35" y="43" font-size="17">ILLUSTRATIVE EXAMPLE · SYNTHETIC TIMES</text><path d="M75 170H820" stroke="#365d49" stroke-width="3"/><path d="M380 80V270" stroke="#365d49" stroke-width="2" stroke-dasharray="7 5"/><path d="M392 265H820" stroke="#365d49" stroke-width="14"/><g fill="#213c32"><circle cx="130" cy="170" r="7"/><circle cx="380" cy="170" r="7"/><circle cx="680" cy="170" r="7"/></g><g font-size="24"><text x="90" y="145">09:50</text><text x="340" y="145">10:00</text><text x="640" y="145">10:12</text></g><g font-size="19"><text x="60" y="207">Measured</text><text x="315" y="207">Prediction</text><text x="600" y="207">Entered in record</text><text x="505" y="302">Outcome window →</text><text x="35" y="355">Exclude the value if it was not available at 10:00.</text></g></g></svg>
